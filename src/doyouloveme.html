<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Do You Love Me</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            height: 100vh;
            overflow: hidden;
            background: #ffe6f0;
        }

        h1 {
            margin-top: 100px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            cursor: pointer;
            position: absolute;
        }

        #yes {
            left: 40%;
            top: 50%;
        }

        #no {
            left: 55%;
            top: 50%;
        }

        /* Trái tim */
        .heart {
            position: absolute;
            color: red;
            font-size: 40px;
            animation: fly 1s linear forwards;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-300px) scale(1.8);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<h1>Do You Love Me? ❤️</h1>

<button id="yes" onclick="sayYes()">YES</button>
<button id="no" onmouseover="runAway()">NO</button>

<script>
    let heartInterval;

    function sayYes() {

        alert("<3");

        // tạo trái tim liên tục
        if (!heartInterval) {
            heartInterval = setInterval(createHeart, 20);
        }
    }

    function createHeart() {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";

        // random vị trí ngang
        let x = Math.random() * window.innerWidth;
        let y = window.innerHeight;

        heart.style.left = x + "px";
        heart.style.top = y + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 3000);
    }

    function runAway() {
        let noBtn = document.getElementById("no");

        let width = window.innerWidth;
        let height = window.innerHeight;

        let randomX = Math.random() * (width - 100);
        let randomY = Math.random() * (height - 50);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
    }
</script>

</body>
</html>
