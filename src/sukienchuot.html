<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Move Image</title>
</head>
<body style="text-align: center;">
<form>
    <img id="myImage"
         src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Football_%28soccer_ball%29.svg"
         style="width: 30%"/>

    <p>Click button below to move the image</p>
    <input type="button" value="Move Left" onclick="moveLeft();" />
    <input type="button" value="Move Right" onclick="moveRight();" />

</form>

<script>
    let imgObj = null;

    function init() {
        imgObj = document.getElementById('myImage');
        imgObj.style.position = 'relative';
        imgObj.style.left = '0px';
    }

    function moveRight() {
        imgObj.style.left = parseInt(imgObj.style.left) + 10 + 'px';
    }

    // 👉 THÊM ĐOẠN NÀY
    function moveLeft() {
        imgObj.style.left = parseInt(imgObj.style.left) - 10 + 'px';
    }

    window.onload = init;
</script>

</body>
</html>
